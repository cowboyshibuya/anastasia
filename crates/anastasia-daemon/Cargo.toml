[package]
name = "anastasia-daemon"
version = "0.1.0"
edition = "2024"
description = "Headless Anastasia provider daemon"
license = "GPL-3.0-only"
readme = "README.md"

[features]
dev-binary = []

[[bin]]
name = "anastasia-daemon"
path = "src/main.rs"

[[bin]]
name = "anastasia-debug-daemon"
path = "src/bin/anastasia-debug-daemon.rs"
required-features = ["dev-binary"]

[dependencies]
anyhow = "1.0"
serde_json = "1.0"
anastasia-core = { path = "../anastasia-core" }
anastasia-protocol = { path = "../anastasia-protocol" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
