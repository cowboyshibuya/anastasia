name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Check tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
            exit 1
          fi

      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            cmake \
            libfontconfig-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            pkg-config \
            xdg-desktop-portal

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.96.0-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-1.96.0-release-

      - name: Bundle
        run: ./scripts/bundle-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: target/release/anastasia-*-x86_64-unknown-linux-gnu.tar.gz
          if-no-files-found: error

  linux-arm64:
    name: Linux arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Check tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
            exit 1
          fi

      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            cmake \
            libfontconfig-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            pkg-config \
            xdg-desktop-portal

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.96.0-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-1.96.0-release-

      - name: Bundle
        run: ./scripts/bundle-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: target/release/anastasia-*-aarch64-unknown-linux-gnu.tar.gz
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Check tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
            exit 1
          fi

      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - uses: oven-sh/setup-bun@v2

      - name: Install create-dmg
        run: brew install create-dmg

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.96.0-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-1.96.0-release-

      # The two Apple secrets are stored in DIFFERENT formats, which is easy
      # to get wrong: MACOS_CERT_P12 is base64, AC_API_KEY_P8 is the raw .p8
      # text. Decoding the key as base64 yields `invalidPrivateKeyContents`.
      - name: Import Apple Developer Certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/release.keychain-db"
          pass="$(openssl rand -hex 16)"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          printf '%s' "$MACOS_CERT_P12" | base64 -d >"$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          # Let codesign use the imported key without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          # The identity is read off the certificate rather than kept as its
          # own secret, so there is one less credential to drift out of sync.
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          [ -n "$identity" ] || { echo "::error::p12 contains no Developer ID Application identity"; exit 1; }
          echo "ANASTASIA_SIGNING_IDENTITY=$identity" >>"$GITHUB_ENV"

      # App Store Connect API key rather than an Apple ID + app-specific
      # password: it is the credential this repository holds, and it carries no
      # personal account.
      - name: Store notary credentials
        env:
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          # Raw .p8 contents — no base64 decode, unlike the certificate above.
          printf '%s' "$AC_API_KEY_P8" >"$RUNNER_TEMP/ac_api_key.p8"
          xcrun notarytool store-credentials NOTARY \
            --key "$RUNNER_TEMP/ac_api_key.p8" \
            --key-id "$AC_API_KEY_ID" \
            --issuer "$AC_API_ISSUER_ID"
          rm -f "$RUNNER_TEMP/ac_api_key.p8"

      - name: Release
        # ANASTASIA_SIGNING_IDENTITY comes from the certificate import above.
        # Anastasia compiles in no analytics and ships no Sparkle feed, so
        # neither an analytics endpoint nor a Sparkle key is passed here.
        run: bun run release --local

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/Anastasia-*.dmg
            dist/Anastasia-*.md
            dist/Anastasia-*.zip
          if-no-files-found: error

  draft-release:
    name: Draft GitHub release
    needs: [linux-x86_64, linux-arm64, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Write release notes
        run: |
          bun -e '
            import { extractReleaseNotes } from "./scripts/changelog.ts";
            const version = process.env.GITHUB_REF_NAME.replace(/^v/i, "");
            const file = Bun.file("CHANGELOG.md");
            const notes = (await file.exists())
              ? extractReleaseNotes(await file.text(), version)
              : null;
            await Bun.write(
              "release-notes.md",
              `${notes ?? "See CHANGELOG.md for details."}\n`,
            );
          '

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          # No appcast.xml: the app ships no update feed, so release.ts skips
          # generating one and fail_on_unmatched_files would fail the job.
          files: |
            artifacts/*.tar.gz
            artifacts/*.dmg
            artifacts/*.md
            artifacts/*.zip
